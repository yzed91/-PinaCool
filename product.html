<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tropical Mango | Pina Cool</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #C84F00 0%,
        #F26E00 30%,
        #F98A05 60%,
        #FDB414 100%
      );
      font-family: Arial, sans-serif;
      color: #222222;
    }

    .productPage {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    .backLink {
      display: inline-block;
      margin-bottom: 18px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .productCard {
      overflow: hidden;
      padding-bottom: 24px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
      text-align: center;
    }

    .productImage {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .productNameEn {
      margin: 24px 16px 4px;
      font-size: 28px;
      line-height: 1.25;
      direction: ltr;
    }

    .productNameAr {
      margin: 0 16px;
      color: #666666;
      font-size: 21px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="productPage">

    <a href="index.html" class="backLink">العودة إلى النكهات</a>

    <article class="productCard">

      <img
        src="Mangoes.PNG"
        alt="Tropical Mango"
        class="productImage"
      >

      <h1 class="productNameEn">Tropical Mango</h1>

      <h2 class="productNameAr">مانجو استوائي</h2>

    </article>

  </main>

</body>
</html>
