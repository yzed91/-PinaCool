<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pina Cool</title>

  <meta name="description" content="الموقع الرسمي لمنتجات Pina Cool">

  <link rel="icon" type="image/jpeg" href="Pina-logo.jpg">
  <link rel="apple-touch-icon" href="Pina-logo.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #222;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      opacity: 1;
      visibility: visible;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro img {
      width: 190px;
      max-width: 65vw;
      opacity: 0;
      transform: scale(.8);
      animation:
        logoEnter .9s ease forwards,
        logoPulse 1.2s ease-in-out .9s;
    }

    @keyframes logoEnter {
      0% {
        opacity: 0;
        transform: scale(.8);
      }

      65% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logoPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    #mainContent {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity .8s ease, transform .8s ease;
    }

    #mainContent.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <div id="intro">
    <img src="Pina-logo.jpg" alt="Pina Cool Logo">
  </div>

  <main id="mainContent">
    <section class="hero">
    </section>
  </main>

  <script>
    window.addEventListener("load", () => {

      const intro = document.getElementById("intro");
      const mainContent = document.getElementById("mainContent");

      setTimeout(() => {
        intro.classList.add("hide");
        mainContent.classList.add("show");
      }, 1800);

    });
  </script>

</body>
</html>
