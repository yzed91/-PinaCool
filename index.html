<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Pina Cool</title>

  <meta name="description" content="الموقع الرسمي لمنتجات Pina Cool">

  <link rel="icon" type="image/jpeg" href="Pina-logo.jpg">
  <link rel="apple-touch-icon" href="Pina-logo.jpg">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: #f79300;
      color: #222222;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro img {
      width: 190px;
      max-width: 65vw;
      height: auto;
      opacity: 0;
      transform: scale(0.8);
      animation:
        logoEnter 0.9s ease forwards,
        logoPulse 1.2s ease-in-out 0.9s;
    }

    @keyframes logoEnter {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }

      65% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logoPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    .backgroundLayer {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100dvh;
      background: #f79300;
      overflow: hidden;
    }

    .backgroundLayer img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
    }

    #mainContent {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100dvh;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #mainContent.show {
      opacity: 1;
    }

    .hero {
      width: 100%;
      min-height: 100dvh;
    }
  </style>
</head>

<body>

  <div id="intro">
    <img src="Pina-logo.jpg" alt="Pina Cool Logo">
  </div>

  <div class="backgroundLayer">
    <img src="WALL.png" alt="Pina Cool Products">
  </div>

  <main id="mainContent">
    <section class="hero"></section>
  </main>

  <script>
    window.addEventListener("load", () => {
      const intro = document.getElementById("intro");
      const mainContent = document.getElementById("mainContent");

      setTimeout(() => {
        intro.classList.add("hide");
        mainContent.classList.add("show");
      }, 1800);
    });
  </script>

</body>
</html>
